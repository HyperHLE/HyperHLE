name: Build touchHLE Android

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    runs-on: ubuntu-latest  
    env:
      # LIMITS memory usage to prevent the Exit 101 Panic
      CARGO_BUILD_JOBS: 1
      RUSTFLAGS: "-C codegen-units=1 -C debuginfo=0"

    steps:  
    - name: Checkout touchHLE  
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Tools
      run: |
        # 1. Boost: Fixes the "Could not find Boost" error
        curl -L -o boost.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"
        mkdir -p vendor
        7z x boost.7z -ovendor
        mv vendor/boost_1_81_0 vendor/boost

        # 2. Gradle: Downloads the correct version
        curl -L -o gradle.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
        unzip -q gradle.zip
        echo "$GITHUB_WORKSPACE/gradle-8.11.1/bin" >> $GITHUB_PATH
        
        # 3. NDK: Links it to the path touchHLE expects
        curl -L -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"
        unzip -q ndk.zip
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        ln -s $GITHUB_WORKSPACE/android-ndk-r25c $ANDROID_SDK_ROOT/ndk/25.2.9519653

    - name: Install Rust Android Target
      run: |
        rustup target add aarch64-linux-android
        cargo install cargo-ndk@3.5.4

    - name: Build APK
      run: |
        cd android
        gradle assembleRelease
        mv app/build/outputs/apk/release/app-release.apk ../touchHLE.apk
      env:  
        ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r25c
        BOOST_ROOT: ${{ github.workspace }}/vendor/boost
        CMAKE: cmake

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: touchHLE_Android
        path: touchHLE.apk
        
