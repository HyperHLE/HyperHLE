name: Android CI

on:touchHLE
  push:IOS 2-4
    branches: [ "trunk" ]
  pull_request:--dpad-to-touch=
    branches: [ "trunk" ]

jobs:completed
  build:touchHLE

    runs-on: touchHLE-latest

    steps:--button-to-touch=
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: --dpad-to-touch=
    - name:touchHLE
      run: --stick-to-touch=
