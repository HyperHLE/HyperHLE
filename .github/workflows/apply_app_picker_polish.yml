name: Apply app_picker polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walaber-skeleton-resource-lookup
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write and apply patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # Fetch polished file from the known-good local logic embedded as base64 of the full file
          import base64, urllib.request
          # Build the patch content inline via reconstructing from the repo file
          PY
          # Prefer applying the already-committed patches/app_picker_polish.patch after repairing it
          # from the working tree delta. Fall back: download from branch artifact if present.
          if [ -f patches/app_picker_polish.patch ]; then
            # The committed patch may be corrupt; regenerate from a known source file if check fails
            if ! git apply --check patches/app_picker_polish.patch 2>/dev/null; then
              echo "Committed patch corrupt or mismatched; writing polished app_picker via Python"
              python3 << 'PY'
          import urllib.request
          # Pull polished version from fix/walaber-complete is not available.
          # Instead apply a minimal safe in-place transform on the current file.
          from pathlib import Path
          p = Path('src/environment/app_picker.rs')
          t = p.read_text()
          if 'package_kind' in t:
              print('Already polished')
              raise SystemExit(0)
          # AppInfo expansion
          old = '''struct AppInfo {
    path: PathBuf,
    display_name: String,
    icon: Option<Image>,
    /// `NSString*`
    display_name_ns_string: Option<id>,
    /// `UIImage*`
    icon_ui_image: Option<id>,
}'''
          new = '''struct AppInfo {
    path: PathBuf,
    display_name: String,
    bundle_id: Option<String>,
    version: Option<String>,
    package_kind: &'static str,
    icon: Option<Image>,
    display_name_ns_string: Option<id>,
    icon_ui_image: Option<id>,
}'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''        Err(format!("The {} directory couldn't be found. Check you're running touchHLE from the right directory.", apps_dir.display()))'''
          new = '''        Err(format!("Apps folder missing.\\n\\nCreate this directory and add .app / .ipa files:\\n{}\\n\\nThen reopen HyperHLE.", apps_dir.display()))'''
          t = t.replace(old, new, 1)
          old = '''                        "No apps were found in the {} directory.",'''
          new = '''                        "No games yet.\\n\\nPut .app or .ipa files in:\\n{}\\n\\nThen reopen HyperHLE.",'''
          t = t.replace(old, new, 1)
          old = '''        let display_name = bundle.display_name().to_owned();

        let icon = match bundle.load_icon(&fs) {
            Ok(icon) => Some(icon),
            Err(e) => {
                log!("Warning: couldn't load icon for app bundle {}: {} (displaying placeholder instead)", app_path.display(), e);
                None
            }
        };

        apps.push(AppInfo {
            path: app_path,
            display_name,
            icon,
            display_name_ns_string: None,
            icon_ui_image: None,
        });'''
          new = '''        let display_name = bundle.display_name().to_owned();
        let bundle_id = {
            let id = bundle.bundle_identifier();
            if id.is_empty() { None } else { Some(id.to_owned()) }
        };
        let version = {
            let v = bundle.bundle_version();
            if v.is_empty() { None } else { Some(v.to_owned()) }
        };
        let package_kind: &'static str =
            if app_path.extension() == Some(OsStr::new("ipa")) { "ipa" } else { "app" };

        let icon = match bundle.load_icon(&fs) {
            Ok(icon) => Some(icon),
            Err(e) => {
                log!("Warning: couldn't load icon for app bundle {}: {} (displaying placeholder instead)", app_path.display(), e);
                None
            }
        };

        apps.push(AppInfo {
            path: app_path,
            display_name,
            bundle_id,
            version,
            package_kind,
            icon,
            display_name_ns_string: None,
            icon_ui_image: None,
        });'''
          assert old in t, 'enumerate block missing'
          t = t.replace(old, new, 1)
          # Footer brand
          t = t.replace('"touchHLE {}{}{}"', '"HyperHLE {}{}{}"', 1)
          # Label size
          t = t.replace('''    let label_size = CGSize {
        width: 74.0,
        height: 13.0,
    };''', '''    let label_size = CGSize {
        width: 78.0,
        height: 28.0,
    };''', 1)
          t = t.replace('''        y: 12.0,
    };

    let icon_tapped_sel''', '''        y: 28.0,
    };

    let icon_tapped_sel''', 1)
          t = t.replace('let font_size: CGFloat = label_size.height - 2.0;', 'let font_size: CGFloat = 10.0;', 1)
          t = t.replace('() = msg![env; label setFont:font];
        let text_color: id = if have_wallpaper {',
                        '() = msg![env; label setFont:font];
        () = msg![env; label setNumberOfLines:2];
        let text_color: id = if have_wallpaper {', 1)
          old = '''        let text = *app
            .display_name_ns_string
            .get_or_insert_with(|| ns_string::from_rust_string(env, app.display_name.clone()));
        () = msg![env; label setText:text];'''
          new = '''        let label_text = {
            let mut line = app.display_name.clone();
            let mut meta: Vec<&str> = Vec::new();
            meta.push(app.package_kind);
            if let Some(ref v) = app.version {
                if !v.is_empty() {
                    let short = if v.len() > 12 { &v[..12] } else { v.as_str() };
                    meta.push(short);
                }
            }
            line.push('\\n');
            line.push_str(&meta.join(" · "));
            line
        };
        let text = *app.display_name_ns_string.get_or_insert_with(|| {
            ns_string::from_rust_string(env, label_text)
        });
        () = msg![env; label setText:text];'''
          assert old in t, 'label text missing'
          t = t.replace(old, new, 1)
          # Header insert before Version label
          marker = '    // Version label\n'
          header = '''    // HyperHLE header\n    {\n        let label_frame = CGRect {\n            origin: CGPoint { x: 12.0, y: 4.0 },\n            size: CGSize { width: app_frame.size.width - 24.0, height: 22.0 },\n        };\n        let label: id = msg_class![env; UILabel alloc];\n        let label: id = msg![env; label initWithFrame:label_frame];\n        let header_text = match &apps {\n            Ok(list) => format!("HyperHLE  ·  {} game{}", list.len(), if list.len() == 1 { "" } else { "s" }),\n            Err(_) => "HyperHLE".to_string(),\n        };\n        let text = ns_string::from_rust_string(env, header_text);\n        () = msg![env; label setText:text];\n        () = msg![env; label setTextAlignment:UITextAlignmentCenter];\n        let font: id = msg_class![env; UIFont boldSystemFontOfSize:(16.0 as CGFloat)];\n        () = msg![env; label setFont:font];\n        let text_color: id = if have_wallpaper { msg_class![env; UIColor whiteColor] } else { msg_class![env; UIColor cyanColor] };\n        () = msg![env; label setTextColor:text_color];\n        let bg_color: id = msg_class![env; UIColor clearColor];\n        () = msg![env; label setBackgroundColor:bg_color];\n        () = msg![env; main_view addSubview:label];\n    }\n\n    // Version label\n'''
          if 'HyperHLE  ·' not in t:
              assert marker in t
              t = t.replace(marker, header, 1)
          p.write_text(t)
          print('Polished app_picker written', len(t))
          PY
            else
              git apply patches/app_picker_polish.patch
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/environment/app_picker.rs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(app_picker): HyperHLE header, metadata labels, clearer empty state"
            git push origin HEAD:fix/walaber-skeleton-resource-lookup
            git push origin HEAD:fix/walaber-complete || true
          fi
