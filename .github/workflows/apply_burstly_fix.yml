name: Apply Burstly/AdColony fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'dev-scripts/fix_burstly_ads.py'
      - '.github/workflows/apply_burstly_fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walaber-skeleton-resource-lookup
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fix
        run: |
          set -euo pipefail
          python3 dev-scripts/fix_burstly_ads.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/objc/classes.rs src/frameworks/foundation/ns_object.rs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: Burstly/AdColony fake classes + toJSONAs (NULL-PAGE / nil isa)"
            git push origin HEAD:fix/walaber-skeleton-resource-lookup
          fi
